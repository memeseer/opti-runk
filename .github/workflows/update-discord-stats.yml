name: Update Discord stats

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: update-discord-stats
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      GUILD_ID: "1354818163879182519"
      MODE: incremental
      CHECKPOINT_PATH: checkpoint.json
      EXPORT_PATH: users.json
      FETCH_MEMBER_DISPLAY: "0"
      FALLBACK_MEMBER_FETCH: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Update Discord statistics
        run: python user_stats.py

      - name: Rebuild website data
        run: node leaderboard/scripts/build-leaderboard-data.mjs

      - name: Commit updated data
        shell: bash
        run: |
          if git diff --quiet -- checkpoint.json users.json leaderboard/public/leaderboard-data.json; then
            echo "No new Discord activity."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add checkpoint.json users.json leaderboard/public/leaderboard-data.json
          git commit -m "chore: update Discord leaderboard data"
          git push

